# Pytest configuration for the Ficshon backend.
#
# Created by the external-cost safety checkpoint. The suite previously ran with
# NO configuration file at all, which meant two things worth fixing:
#
#   * a bare ``pytest`` collected from the rootdir, so anything importable under
#     ``backend/`` could be collected — including ``scripts/``, which holds
#     ~11 harnesses that call paid providers BY DESIGN (RunPod training, Adult
#     Studio inference, provider bake-offs). Those scripts are deliberate and
#     stay exactly as they are; they must simply never be collected as tests.
#   * ``tests/conftest.py`` — which strips provider credentials and installs the
#     outbound-network guard — only applies to what is collected under
#     ``tests/``. A run pointed elsewhere would have neither protection.
#
# ``testpaths`` makes the safe scope the default one.
[pytest]
testpaths = tests
